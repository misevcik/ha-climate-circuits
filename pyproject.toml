[project]
name = "ha-climate-circuits"
version = "0.1.0"
description = "Home Assistant integration that runs hydronic heating and cooling circuits: mode, demand, pumps and mixing valves"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
combine-as-imports = true
